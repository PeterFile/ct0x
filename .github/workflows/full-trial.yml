# Generated by .github/scripts/full-trial-workflow.py; do not edit by hand.
name: Full scheduling trial

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      scheme:
        type: string
        required: true
      repeat:
        type: number
        required: true
      shard_parallel:
        type: number
        required: true
    outputs:
      verified:
        value: ${{ jobs.aggregate.outputs.verified }}
      receipt:
        value: ${{ jobs.aggregate.outputs.receipt }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'
  TRIAL_SHA: ${{ inputs.sha }}
  TRIAL_SCHEME: ${{ inputs.scheme }}
  TRIAL_REPEAT: ${{ inputs.repeat }}
  TRIAL_PARALLEL: ${{ inputs.shard_parallel }}

jobs:
  preflight:
    name: Trial preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      workspace: ${{ steps.plan.outputs.workspace }}
      parallel: ${{ steps.plan.outputs.parallel }}
      tree: ${{ steps.plan.outputs.tree }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .trial-controller
          persist-credentials: false
      - name: Verify immutable product and controller
        run: python3 .trial-controller/.github/scripts/full-trial.py identity
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Compiled inventories and ordinary workspace monolith
        id: plan
        run: python3 .trial-controller/.github/scripts/full-trial.py preflight
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web test, typecheck and build
        run: python3 .github/scripts/ci-plan.py web "$RUNNER_TEMP/trial-client.json"
      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: extensions/pi-bridge/package-lock.json
      - name: Pi bridge test and typecheck
        run: python3 .github/scripts/ci-plan.py bridge "$RUNNER_TEMP/trial-client.json"
      - uses: actions/upload-artifact@v7
        with:
          name: full-trial-${{ inputs.scheme }}-r${{ inputs.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}-plan
          path: ${{ runner.temp }}/trial-plan
          if-no-files-found: error
          retention-days: 7
      - name: Preserve compact preflight timing
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: full-trial-${{ inputs.scheme }}-r${{ inputs.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}-timing-preflight
          path: ${{ runner.temp }}/trial-timing.jsonl
          if-no-files-found: error
          retention-days: 7

  go-shards:
    name: Trial shard ${{ matrix.job_number }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.preflight.outputs.parallel) }}
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    env:
      TRIAL_JOB_NUMBER: ${{ matrix.job_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .trial-controller
          persist-credentials: false
      - name: Verify immutable product and controller
        run: python3 .trial-controller/.github/scripts/full-trial.py identity
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v7
        with:
          name: full-trial-${{ inputs.scheme }}-r${{ inputs.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}-plan
          path: ${{ runner.temp }}/trial-plan
      - name: Execute and verify shard
        run: python3 .trial-controller/.github/scripts/full-trial.py shard
      - uses: actions/upload-artifact@v7
        with:
          name: full-trial-${{ inputs.scheme }}-r${{ inputs.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.job_number }}
          path: ${{ runner.temp }}/trial-receipt
          if-no-files-found: error
          retention-days: 7
      - name: Preserve compact timing even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: full-trial-${{ inputs.scheme }}-r${{ inputs.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}-timing-shard-${{ matrix.job_number }}
          path: ${{ runner.temp }}/trial-timing.jsonl
          if-no-files-found: error
          retention-days: 7

  go-workspace:
    name: Trial workspace ${{ matrix.job_number }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.preflight.outputs.workspace) }}
    env:
      TRIAL_JOB_NUMBER: ${{ matrix.job_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .trial-controller
          persist-credentials: false
      - name: Verify immutable product and controller
        run: python3 .trial-controller/.github/scripts/full-trial.py identity
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v7
        with:
          name: full-trial-${{ inputs.scheme }}-r${{ inputs.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}-plan
          path: ${{ runner.temp }}/trial-plan
      - name: Execute and verify workspace
        run: python3 .trial-controller/.github/scripts/full-trial.py workspace
      - uses: actions/upload-artifact@v7
        with:
          name: full-trial-${{ inputs.scheme }}-r${{ inputs.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}-workspace-${{ matrix.job_number }}
          path: ${{ runner.temp }}/trial-receipt
          if-no-files-found: error
          retention-days: 7
      - name: Preserve compact timing even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: full-trial-${{ inputs.scheme }}-r${{ inputs.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}-timing-workspace-${{ matrix.job_number }}
          path: ${{ runner.temp }}/trial-timing.jsonl
          if-no-files-found: error
          retention-days: 7

  go-other:
    name: Go ordinary and remaining race
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .trial-controller
          persist-credentials: false
      - name: Verify immutable product and controller
        run: python3 .trial-controller/.github/scripts/full-trial.py identity
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Ordinary test coordination package
        run: go test -count=1 ./internal/coordination
      - name: Race test coordination package
        run: go test -count=1 -race ./internal/coordination
      - name: Race test all other packages
        run: |
          set -euo pipefail
          store=$(go list ./internal/store)
          platform=$(go list ./internal/platform)
          httpapi=$(go list ./internal/httpapi)
          coordination=$(go list ./internal/coordination)
          workspace=$(go list ./cmd/workspace)
          [[ -n "$store" && "$store" != *$'\n'* &&
             -n "$platform" && "$platform" != *$'\n'* &&
             -n "$httpapi" && "$httpapi" != *$'\n'* &&
             -n "$coordination" && "$coordination" != *$'\n'* &&
             -n "$workspace" && "$workspace" != *$'\n'* &&
             "$store" != "$platform" && "$store" != "$coordination" && "$platform" != "$coordination" &&
             "$httpapi" != "$store" && "$httpapi" != "$platform" && "$httpapi" != "$coordination" &&
             "$workspace" != "$store" && "$workspace" != "$platform" &&
             "$workspace" != "$httpapi" && "$workspace" != "$coordination" ]] || exit 1
          all=$(go list ./...)
          rest=()
          store_count=0
          platform_count=0
          httpapi_count=0
          coordination_count=0
          workspace_count=0
          while IFS= read -r package; do
            [[ -n "$package" ]] || exit 1
            if [[ "$package" == "$store" ]]; then
              store_count=$((store_count + 1))
            elif [[ "$package" == "$platform" ]]; then
              platform_count=$((platform_count + 1))
            elif [[ "$package" == "$httpapi" ]]; then
              httpapi_count=$((httpapi_count + 1))
            elif [[ "$package" == "$coordination" ]]; then
              coordination_count=$((coordination_count + 1))
            elif [[ "$package" == "$workspace" ]]; then
              workspace_count=$((workspace_count + 1))
            else
              rest+=("$package")
            fi
          done <<< "$all"
          [[ "$store_count" -eq 1 && "$platform_count" -eq 1 && "$httpapi_count" -eq 1 && "$coordination_count" -eq 1 && "$workspace_count" -eq 1 && "${#rest[@]}" -gt 0 ]] || exit 1
          GOFLAGS="${GOFLAGS:+$GOFLAGS }-timeout=14m" go test -race "${rest[@]}"

  go-vet:
    name: Go vet and CI gates
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .trial-controller
          persist-credentials: false
      - name: Verify immutable product and controller
        run: python3 .trial-controller/.github/scripts/full-trial.py identity
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      - name: Test CI scheduling and shard gates
        run: |
          set -euo pipefail
          python3 .github/scripts/test-ci-scheduling.py -v
          python3 .github/scripts/test-store-shard.py -v
      - name: Test trial evidence and workflow projection
        run: |
          set -euo pipefail
          python3 .trial-controller/.github/scripts/test-full-trial.py -v
          python3 .trial-controller/.github/scripts/full-trial-workflow.py --check

  go-benchmarks:
    name: Go benchmarks
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .trial-controller
          persist-credentials: false
      - name: Verify immutable product and controller
        run: python3 .trial-controller/.github/scripts/full-trial.py identity
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Record benchmark metrics
        env:
          HEAD_SHA: ${{ inputs.sha }}
          BASE_SHA: ${{ needs.preflight.outputs.base }}
          CHECKOUT_SHA: ${{ inputs.sha }}
          CHECKOUT_TREE: ${{ needs.preflight.outputs.tree }}
        run: |
          set -euo pipefail
          printf 'CI identity run=%s head=%s base=%s merge=%s tree=%s\n' "$GITHUB_RUN_ID" "$HEAD_SHA" "$BASE_SHA" "$CHECKOUT_SHA" "$CHECKOUT_TREE"
          # Keep only complete standard benchmark records, never raw test output.
          go test -run '^$' -bench . -benchmem ./... |
            awk '
              BEGIN { number = "^[0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?$" }
              $1 ~ /^Benchmark[A-Za-z0-9_.\/=+-]+$/ &&
              $2 ~ /^[0-9]+$/ && $3 ~ number && $4 == "ns/op" {
                if (NF == 10 && $5 ~ number && $6 == "MB/s") {
                  bytes = 7
                } else if (NF == 8) {
                  bytes = 5
                } else {
                  next
                }
                if ($bytes !~ /^[0-9]+$/ || $(bytes + 1) != "B/op" ||
                    $(bytes + 2) !~ /^[0-9]+$/ || $(bytes + 3) != "allocs/op") next
                $1 = $1
                print
              }
            ' > "$RUNNER_TEMP/go-benchmarks.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: full-trial-${{ inputs.scheme }}-r${{ inputs.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}-benchmarks
          path: ${{ runner.temp }}/go-benchmarks.txt
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: Trial final receipt
    permissions:
      contents: read
      actions: read
    needs: [preflight, go-shards, go-workspace, go-other, go-vet, go-benchmarks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified: ${{ steps.receipt.outputs.verified }}
      receipt: ${{ steps.receipt.outputs.receipt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .trial-controller
          persist-credentials: false
      - name: Verify immutable product and controller
        run: python3 .trial-controller/.github/scripts/full-trial.py identity
      - name: Require every same-attempt job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .trial-controller/.github/scripts/full-trial.py results
      - uses: actions/download-artifact@v7
        with:
          name: full-trial-${{ inputs.scheme }}-r${{ inputs.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}-plan
          path: ${{ runner.temp }}/trial-plan
      - uses: actions/download-artifact@v7
        with:
          pattern: full-trial-${{ inputs.scheme }}-r${{ inputs.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}-shard-*
          path: ${{ runner.temp }}/trial-shards
          merge-multiple: false
      - uses: actions/download-artifact@v7
        with:
          pattern: full-trial-${{ inputs.scheme }}-r${{ inputs.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}-workspace-*
          path: ${{ runner.temp }}/trial-workspace
          merge-multiple: false
      - name: Rebuild canonical receipts and run original aggregate
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .trial-controller/.github/scripts/full-trial.py aggregate
      - uses: actions/upload-artifact@v7
        with:
          name: full-trial-${{ inputs.scheme }}-r${{ inputs.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: ${{ runner.temp }}/trial-final.json
          if-no-files-found: error
          retention-days: 7
