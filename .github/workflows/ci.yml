# Temporary experimental controller only; never merge this replacement into master.
name: Historical CI evidence

on:
  workflow_dispatch:
    inputs:
      policy_sha:
        description: '人工审核过的 merge-gate 分支提交（小写四十位 SHA）'
        required: true
        type: string
      phase:
        description: '审计阶段；misses 仅回放三例历史漏选，未指定 focus_sha 时 diagnostics 核验八个固定历史原件'
        required: true
        type: choice
        options: [selector, diagnostics, both, misses]
        default: both
      focus_sha:
        description: '可选：仅审计冻结清单内该小写四十位 SHA；misses 仅允许三例漏选之一；留空沿用原有 113 条/八诊断范围'
        required: false
        type: string
        default: ''
      offset:
        description: 'selector 在冻结清单中的起始位置（0..112）'
        required: false
        type: string
        default: '0'
      count:
        description: 'selector 最大条数（1..150）'
        required: false
        type: string
        default: '150'

permissions:
  contents: read

concurrency:
  group: historical-ci-evidence-experiment
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: 历史证据采集（非产品门禁）
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'PeterFile/ct0x' &&
          github.ref == 'refs/heads/codex/ci-historical-audit-20261126' }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: 检出固定 controller
        uses: actions/checkout@v7
        with:
          repository: PeterFile/ct0x
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 2
          persist-credentials: false
      - name: 初始化终态证据存档
        run: |
          mkdir -p evidence
          printf '%s\n' '{"schema":1,"status":"infrastructure-error","errors":["审计未启动或被中断"],"rows":[]}' > evidence/index.json
      - name: 安装固定 Go（不上传缓存）
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: false
      - name: 只读历史回放
        env:
          AUDIT_READ_TOKEN: ${{ github.token }}
        run: python3 -B controller/.github/scripts/ci-historical-audit.py run
      - name: 归档未完成项为 unknown
        if: ${{ always() && hashFiles('controller/.github/scripts/ci-historical-audit.py') != '' }}
        run: python3 -B controller/.github/scripts/ci-historical-audit.py finalize
      - name: 上传原始证据与索引
        if: ${{ always() && hashFiles('evidence/index.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: historical-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
