name: Full trial checkout probe
run-name: 'Full trial checkout probe at ${{ inputs.sha }}'

on:
  workflow_dispatch:
    inputs:
      sha:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TRIAL_SHA: ${{ inputs.sha }}
  TRIAL_SCHEME: a
  TRIAL_REPEAT: '1'
  TRIAL_PARALLEL: '7'
  GOTOOLCHAIN: local
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .trial-controller
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Stage verified trial controller
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/.trial-controller"
          target="$RUNNER_TEMP/trial-controller"
          [[ -d "$source/.git" && ! -L "$source" && ! -e "$target" && ! -L "$target" ]] || exit 1
          actual=$(git -C "$source" rev-parse HEAD)
          [[ "$actual" == "$GITHUB_SHA" ]] || exit 1
          mv "$source" "$target"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Verify immutable product and controller
        run: python3 "$RUNNER_TEMP/trial-controller/.github/scripts/full-trial.py" identity
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify clean checkout and original coordination gate
        run: |
          set -euo pipefail
          controller="$RUNNER_TEMP/trial-controller"
          product_sha=$(git rev-parse HEAD)
          product_tree=$(git rev-parse 'HEAD^{tree}')
          controller_sha=$(git -C "$controller" rev-parse HEAD)
          controller_tree=$(git -C "$controller" rev-parse 'HEAD^{tree}')
          status=$(git status --porcelain=v1 --untracked-files=all)
          printf 'product_sha=%s\nproduct_tree=%s\ncontroller_sha=%s\ncontroller_tree=%s\n' \
            "$product_sha" "$product_tree" "$controller_sha" "$controller_tree"
          printf 'product_git_status=%s\n' "${status:-clean}"
          [[ "$TRIAL_SHA" == "18d11a3c0176fe98856aeeef6396e9ddfde0cca0" && "$product_sha" == "$TRIAL_SHA" ]] || exit 1
          [[ "$product_tree" == "6df8bf3ccb986f8f4088dc310e0257b3f6285d9a" && "$controller_sha" == "$GITHUB_SHA" ]] || exit 1
          [[ -z "$status" && ! -e .trial-controller && ! -L .trial-controller ]] || exit 1
          for script in full-trial.py full-trial-plan.py full-trial-events.py full-trial-receipts.py full-trial-workflow.py test-full-trial.py; do
            [[ -f "$controller/.github/scripts/$script" && ! -L "$controller/.github/scripts/$script" ]] || exit 1
          done
          go test -count=1 -run '^TestCoordinationDecideNoProductionCallsites$' -v ./internal/coordination
