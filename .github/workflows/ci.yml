name: Periodic Full attribution experiment
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
        description: Fixed master target for the controlled test overlay
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: periodic-full-attribution-experiment
  cancel-in-progress: false
jobs:
  experiment:
    name: Confirm first failing merge under controlled test overlay
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      FIXED_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Authenticate the historical green Full at its exact attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/periodic-experiment.py prove "$RUNNER_TEMP/proof"
      - name: Localize the controlled fault on master first parents without API credentials
        run: python3 -B .github/scripts/periodic-experiment.py replay "$RUNNER_TEMP/proof"
      - name: Authenticate the actual merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/periodic-experiment.py associate "$RUNNER_TEMP/proof"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: experimental-periodic-fault-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof
          if-no-files-found: error
          retention-days: 14
