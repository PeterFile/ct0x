name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  STORE_RACE_GROUP: '^Test(Coordination|Coordinator|RequestWork|RequestDispatch|GetDispatch|Dispatch)'

jobs:
  go-store-a:
    name: Go Store A
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run and verify Store shard A
        run: |
          set -euo pipefail
          package=$(go list ./internal/store)
          go test -race -json -list '^(Test|Example|Fuzz)' ./internal/store | tee "$RUNNER_TEMP/store-list.json"
          go test -race -json -run "$STORE_RACE_GROUP" ./internal/store | tee "$RUNNER_TEMP/store-run.json"
          python3 .github/scripts/verify-store-shard.py run "$package" "$RUNNER_TEMP/store-list.json" "$RUNNER_TEMP/store-run.json"

  go-store-b:
    name: Go Store B
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run and verify Store shard B
        run: |
          set -euo pipefail
          package=$(go list ./internal/store)
          go test -race -json -list '^(Test|Example|Fuzz)' ./internal/store | tee "$RUNNER_TEMP/store-list.json"
          go test -race -json -skip "$STORE_RACE_GROUP" ./internal/store | tee "$RUNNER_TEMP/store-run.json"
          python3 .github/scripts/verify-store-shard.py skip "$package" "$RUNNER_TEMP/store-list.json" "$RUNNER_TEMP/store-run.json"

  go:
    name: Go
    needs: [go-store-a, go-store-b]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Store shards
        env:
          STORE_A_RESULT: ${{ needs.go-store-a.result }}
          STORE_B_RESULT: ${{ needs.go-store-b.result }}
        run: test "$STORE_A_RESULT" = success && test "$STORE_B_RESULT" = success
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Race test all other packages
        run: |
          set -euo pipefail
          store=$(go list ./internal/store)
          all=$(go list ./...)
          rest=()
          store_count=0
          while IFS= read -r package; do
            if [[ "$package" == "$store" ]]; then
              store_count=$((store_count + 1))
            else
              rest+=("$package")
            fi
          done <<< "$all"
          [[ -n "$store" && "$store" != *$'\n'* && "$store_count" -eq 1 && "${#rest[@]}" -gt 0 ]] || exit 1
          go test -race "${rest[@]}"
      - run: go vet ./...
      - name: Record benchmark metrics
        run: |
          set -euo pipefail
          # Keep only complete standard benchmark records, never raw test output.
          go test -run '^$' -bench . -benchmem ./... |
            awk '
              BEGIN { number = "^[0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?$" }
              $1 ~ /^Benchmark[A-Za-z0-9_.\/=+-]+$/ &&
              $2 ~ /^[0-9]+$/ && $3 ~ number && $4 == "ns/op" {
                if (NF == 10 && $5 ~ number && $6 == "MB/s") {
                  bytes = 7
                } else if (NF == 8) {
                  bytes = 5
                } else {
                  next
                }
                if ($bytes !~ /^[0-9]+$/ || $(bytes + 1) != "B/op" ||
                    $(bytes + 2) !~ /^[0-9]+$/ || $(bytes + 3) != "allocs/op") next
                $1 = $1
                print
              }
            ' > "$RUNNER_TEMP/go-benchmarks.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: go-benchmarks
          path: ${{ runner.temp }}/go-benchmarks.txt
          if-no-files-found: error
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  pi-bridge:
    name: Pi bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extensions/pi-bridge
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: extensions/pi-bridge/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
