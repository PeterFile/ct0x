name: Historical Web attribution replay
on:
  workflow_dispatch:
    inputs:
      sha:
        type: string
        required: true
        description: Exact archived GitHub merge checkout for PR 154
permissions:
  contents: read
  actions: read
jobs:
  replay:
    name: Reconstruct both historical Web assertions
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      FIXED_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 3b7ff2f557df978e6c956487f9ba1875c56ae34f
          path: subject
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.5
          package-manager-cache: false
      - name: Authenticate original run attempt, log and checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B control/.github/scripts/periodic-historical-web.py source "$RUNNER_TEMP/proof"
      - name: Run four named Vitest probes with the original pinned Node and npm
        run: python3 -B control/.github/scripts/periodic-historical-web.py probe "$RUNNER_TEMP/proof"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: experimental-historical-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof
          if-no-files-found: error
          retention-days: 14
