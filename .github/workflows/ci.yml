name: Historical CI diagnostic replay
on:
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [vet, python, periodic]
        required: true
        description: Original failing command
      sha:
        type: string
        required: true
        description: Authenticated archived checkout
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: ${{ (inputs.kind == 'vet' && inputs.sha == '66e71aa66a1a58f52c8fa0b545d0aa135eab381a') || (inputs.kind == 'python' && inputs.sha == '85b488fa772dc1197241e730131aee5f2c8d365a') }}
    name: Reconstruct archived ${{ inputs.kind }} failure twice
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIXED_CASE: ${{ inputs.kind }}
      FIXED_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          path: subject
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: false
      - name: Select the original Ubuntu system Python already installed on the hosted image
        if: ${{ inputs.kind == 'python' }}
        run: |
          set -euo pipefail
          /usr/bin/python3 --version
          [[ "$(/usr/bin/python3 --version)" == 'Python 3.14.4' ]]
          mkdir -p "$RUNNER_TEMP/original-python"
          ln -s /usr/bin/python3 "$RUNNER_TEMP/original-python/python3"
          echo "$RUNNER_TEMP/original-python" >> "$GITHUB_PATH"
      - name: Authenticate original failing job, command and tested Git tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B control/.github/scripts/periodic-historical-diagnostic.py source "$RUNNER_TEMP/proof"
      - name: Run the exact original command twice and retain raw output
        run: python3 -B control/.github/scripts/periodic-historical-diagnostic.py repeat "$RUNNER_TEMP/proof"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: experimental-historical-${{ inputs.kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof
          if-no-files-found: error
          retention-days: 14

  current-periodic:
    if: ${{ inputs.kind == 'periodic' && inputs.sha == '18d11a3c0176fe98856aeeef6396e9ddfde0cca0' }}
    name: Verify frozen periodic policy on actual master history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    concurrency:
      group: ci-periodic-fault-current-policy
      cancel-in-progress: false
    env:
      FROZEN_POLICY: 'f45f08de30f0046d86362ed186f16a22436afa3c'
      FIXED_PRODUCT: ${{ inputs.sha }}
    steps:
      - name: Check out the immutable experiment driver
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out the frozen periodic policy and first-parent history
        uses: actions/checkout@v7
        with:
          ref: 'f45f08de30f0046d86362ed186f16a22436afa3c'
          path: policy
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the product at the declared target
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          path: subject
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: subject/go.mod
          cache: false
      - name: Authenticate the successful Full baseline and both immutable trees
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B control/.github/scripts/periodic-current-probe.py authorize "$RUNNER_TEMP/periodic-check"
      - name: Check out the public release Full policy fixture
        uses: actions/checkout@v7
        with:
          ref: '5f9b9e691fb3efac3e5e0812ef73c469c88f067e'
          path: release-policy
          sparse-checkout: .github
          persist-credentials: false
      - name: Exercise the periodic reader on the optional release policy layout
        run: python3 -B control/.github/scripts/periodic-compat-sample.py "$RUNNER_TEMP/periodic-check"
      - name: Reproduce the controlled assertion and verify the precise adjacent boundary
        run: python3 -B control/.github/scripts/periodic-current-probe.py replay "$RUNNER_TEMP/periodic-check"
      - name: Authenticate the producing merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B control/.github/scripts/periodic-current-probe.py associate "$RUNNER_TEMP/periodic-check"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: periodic-current-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/periodic-check/*.json
            ${{ runner.temp }}/periodic-check/*.jsonl
            ${{ runner.temp }}/periodic-check/api-*/**
            ${{ runner.temp }}/periodic-check/initial/**
            ${{ runner.temp }}/periodic-check/localization/**
          if-no-files-found: error
          retention-days: 14
