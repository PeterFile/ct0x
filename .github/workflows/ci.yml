# Dedicated probe branch only; never merge.
name: Full scheduling dispatch probe
run-name: Full scheduling dispatch probe (${{ inputs.sha }})

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 待检出的完整 40 位小写十六进制提交 SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: 校验提交并输出树对象
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'sha 必须恰好为 40 位小写十六进制字符。' >&2
            exit 1
          fi
          resolved_sha="$(git rev-parse HEAD)"
          if [[ "$resolved_sha" != "$INPUT_SHA" ]]; then
            printf '%s\n' '检出的 HEAD 与输入 SHA 不一致。' >&2
            exit 1
          fi
          git rev-parse 'HEAD^{tree}'
