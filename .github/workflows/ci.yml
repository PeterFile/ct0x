# Task-only overlay at .github/workflows/ci.yml, not a product workflow.
name: 五个 CI 草案的组合契约验证
run-name: CI 契约 ${{ inputs.sha }} / ${{ inputs.tree }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 已组装产品提交的完整小写 SHA
        required: true
        type: string
      tree:
        description: 已组装产品 Git 树的完整小写 SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  contracts:
    name: Linux 组合契约
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ inputs.sha }}
      TARGET_TREE: ${{ inputs.tree }}
      CONTROL_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GOTOOLCHAIN: local
    steps:
      - name: 初始化有界回执
        id: receipt
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              "schema": 1, "kind": "hosted-ci-contracts", "result": "incomplete",
              "requested": {"sha": os.environ["TARGET_SHA"], "tree": os.environ["TARGET_TREE"]},
              "product": None, "control_sha": os.environ["CONTROL_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "identity": "not_verified", "discovery": {"result": "not_run"},
              "actionlint": {"result": "not_run"}, "suites": [],
          }
          # Keep malformed dispatch inputs from making an unbounded artifact.
          receipt["requested"] = {k: v[:80] for k, v in receipt["requested"].items()}
          (Path(os.environ["RUNNER_TEMP"]) / "hosted-receipt.json").write_text(json.dumps(receipt) + "\n")
          PY
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: 核验控制提交并切换干净产品树
        id: product
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CONTROL_SHA" ]]
          [[ -f .github/scripts/hosted-checks.py && ! -L .github/scripts/hosted-checks.py ]]
          cp .github/scripts/hosted-checks.py "$RUNNER_TEMP/hosted-checks.py"
          python3 -B "$RUNNER_TEMP/hosted-checks.py" prepare
      - name: 准备不可变基线快照
        id: history
        run: |
          set -euo pipefail
          # The projection test reads this exact historical tree, not moving refs.
          baseline=18d11a3c0176fe98856aeeef6396e9ddfde0cca0
          if ! git cat-file -e "$baseline^{commit}" 2>/dev/null; then
            git -c credential.helper= fetch --no-tags --no-recurse-submodules \
              --no-write-fetch-head --depth=1 origin "$baseline"
          fi
          git cat-file -e "$baseline^{commit}"
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: '24.13.0'
          package-manager-cache: false
      - name: 安装固定校验的 actionlint
        id: actionlint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hosted-actionlint"
          archive="$RUNNER_TEMP/hosted-actionlint/actionlint.tar.gz"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --max-filesize 8388608 --retry 1 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/hosted-actionlint" actionlint
      - name: 逐入口运行真实选择器登记的契约测试
        id: checks
        if: ${{ !cancelled() && steps.product.outcome == 'success' && steps.history.outcome == 'success' && steps.go.outcome == 'success' && steps.node.outcome == 'success' }}
        run: python3 -B "$RUNNER_TEMP/hosted-checks.py" run
      - name: 完成有界回执并保留失败状态
        id: finalize
        if: ${{ always() }}
        env:
          HOSTED_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "hosted-receipt.json"
          def stub(error):
              return {
                  "schema": 1, "kind": "hosted-ci-contracts", "result": "failure", "finalized": True,
                  "requested": {k: os.environ["TARGET_" + k.upper()][:80] for k in ("sha", "tree")},
                  "product": None, "identity": "not_verified", "suites": [], "error": error[:160],
                  "control_sha": os.environ["CONTROL_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              }
          success = False
          try:
              if path.stat().st_size > 65536:
                  raise ValueError("原始回执超过 64 KiB")
              value = json.loads(path.read_text())
              steps = json.loads(os.environ["HOSTED_STEPS"])
              value["steps"] = {k: v["outcome"] for k, v in steps.items()}
              required = ("receipt", "checkout", "product", "history", "go", "node", "actionlint", "checks")
              product = {"sha": os.environ["TARGET_SHA"], "tree": os.environ["TARGET_TREE"]}
              success = (value.get("result") == "success" and value.get("identity") == "success"
                         and value.get("product") == product
                         and ("requested" not in value or value["requested"] == product)
                         and value.get("control_sha") == os.environ["CONTROL_SHA"]
                         and value.get("run_id") == os.environ["GITHUB_RUN_ID"]
                         and value.get("run_attempt") == os.environ["GITHUB_RUN_ATTEMPT"]
                         and value.get("discovery", {}).get("result") == "success"
                         and value.get("actionlint", {}).get("result") == "success"
                         and bool(value.get("suites")) and all(r["result"] == "success" for r in value["suites"])
                         and all(value["steps"].get(k) == "success" for k in required))
              value["result"] = "success" if success else "failure"
              value["finalized"] = True
          except (OSError, ValueError, TypeError, KeyError, AttributeError) as error:
              value = stub(str(error))
          data = json.dumps(value, ensure_ascii=True, sort_keys=True, separators=(",", ":")) + "\n"
          if len(data.encode()) > 65536:
              success = False
              data = json.dumps(stub("完成后的回执超过 64 KiB")) + "\n"
          path.write_text(data)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("upload=true\n")
          if not success:
              raise SystemExit("契约验证或回执未完成，已保存有界失败回执")
          PY
      - name: 保存单个小回执
        if: ${{ always() && steps.finalize.outputs.upload == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: hosted-ci-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-receipt.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 9
