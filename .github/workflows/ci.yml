name: RC dispatch acceptance probe
run-name: RC dispatch probe / ${{ inputs.sha }} / ${{ github.workflow_sha }} / ${{ github.run_id }}-${{ github.run_attempt }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 实验固定产品的完整小写 SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  TARGET_SHA: ${{ inputs.sha }}
  CONTROLLER_SHA: ${{ github.workflow_sha }}
  CONTROLLER_REF: ${{ github.workflow_ref }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  admission:
    name: RC dispatch admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: rc-dispatch-probe-${{ inputs.sha }}-${{ github.workflow_sha }}
      cancel-in-progress: false
    outputs:
      admitted: ${{ steps.admit.outputs.admitted }}
      owner_run_id: ${{ steps.admit.outputs.owner_run_id }}
      owner_job_id: ${{ steps.admit.outputs.owner_job_id }}
      policy_sha: ${{ steps.pin.outputs.policy_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: 固定控制器与受审策略
        id: pin
        run: python3 controller/.github/scripts/rc-dispatch-probe.py pin
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.pin.outputs.policy_sha }}
          path: policy
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: 只读原生查询与实验准入
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 controller/.github/scripts/rc-dispatch-probe.py admit
      # This registration is not production status provenance or verified release evidence.
      - name: 先持久化唯一实验 owner
        if: ${{ steps.admit.outputs.admitted == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: rc-dispatch-owner-${{ inputs.sha }}-${{ github.workflow_sha }}
          path: ${{ runner.temp }}/rc-dispatch-probe/owner/owner.json
          if-no-files-found: error
          retention-days: 7
      - name: 保存本次准入或重复决策
        uses: actions/upload-artifact@v7
        with:
          name: rc-dispatch-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc-dispatch-probe/decision.json
          if-no-files-found: error
          retention-days: 7

  owner-proof:
    name: RC dispatch owner proof
    needs: admission
    if: ${{ needs.admission.result == 'success' && needs.admission.outputs.admitted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admission.outputs.policy_sha }}
          path: policy
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: 重读原生 owner 并验证真实字节及拒绝路径
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 controller/.github/scripts/rc-dispatch-probe.py prove
      - uses: actions/upload-artifact@v7
        with:
          name: rc-dispatch-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc-dispatch-probe/proof.json
          if-no-files-found: error
          retention-days: 7
