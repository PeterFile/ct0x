name: Full scheduling trial
run-name: Full trial ${{ inputs.scheme }}-${{ inputs.repeat }} ${{ inputs.sample_id }} at ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      scheme:
        required: true
        type: choice
        options:
          - a
          - b
          - c
      repeat:
        required: true
        type: choice
        options:
          - '1'
          - '2'
          - '3'
      sample_id:
        required: true
        type: string
      shard_parallel:
        required: false
        type: number
        default: 12

permissions:
  contents: read
  actions: read

jobs:
  trial:
    uses: ./.github/workflows/full-trial.yml
    with:
      sha: ${{ inputs.sha }}
      scheme: ${{ inputs.scheme }}
      repeat: ${{ fromJSON(inputs.repeat) }}
      shard_parallel: ${{ fromJSON(format('{0}', inputs.shard_parallel)) }}
